version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week, so a compromised release is likely pulled before we take it
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait a week, so a compromised release is likely pulled before we take it
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # Base images in the Dockerfile (python, uv)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait a week, so a compromised release is likely pulled before we take it
    cooldown:
      default-days: 7
